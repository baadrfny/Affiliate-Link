services:
  postgres-db:
    image: postgres:16-alpine
    container_name: affiliate-postgres
    environment:
      POSTGRES_DB: affiliate_link_db
      POSTGRES_USER: badr
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - affiliate_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: affiliate-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  affiliate_data:
