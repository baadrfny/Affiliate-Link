services:
  postgres-db:
    image: postgres:16-alpine
    container_name: affiliate-postgres
    environment:
      POSTGRES_DB: affiliate_link_db
      POSTGRES_USER: badr
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - affiliate_data:/var/lib/postgresql/data

volumes:
  affiliate_data: