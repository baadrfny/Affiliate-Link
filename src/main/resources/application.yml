spring:
  application:
    name: affiliate-link

  datasource:
    url: jdbc:postgresql://localhost:5433/affiliate_link_db
    username: badr
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  modulith:
    events:
      republish-outstanding-events-on-restart: true

  data:
    web:
      pageable:
        max-page-size: 50

  mail:
    host: localhost
    port: 1025

logging:
  file:
    name: logs/affiliate-link.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
  level:
    root: INFO
    com.affiliateLink: DEBUG
